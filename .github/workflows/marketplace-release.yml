name: Marketplace release
# Push to main (plugins are synced here already approved): sign and release every plugin in plugins.json that has no
# `<name>-v<version>` tag yet.
#   assets : zips, CycloneDX SBOM, SHA256SUMS, manifest (reproducible)
#   attest : GitHub artifact attestations (Sigstore keyless, no stored keys): signed provenance + SBOM, then verified
#   release: re-verifies, then creates the tag and GitHub Release. Only runs on main.
# Stop releases: set repo variable PUBLISHING_DISABLED=true.
# Manual test: run on a non-main ref with `include` = a plugin name; builds, signs and verifies but never publishes.
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      include:
        description: "Test only: treat this plugin as pending (never publishes)"
        default: ""
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  assets:
    name: release assets
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.p.outputs.pending }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - id: p
        env:
          INCLUDE: ${{ github.event.inputs.include }}
        run: |
          python scripts/pending_releases.py --include "$INCLUDE" > pending.txt
          cat pending.txt
          echo "pending=$(wc -l < pending.txt)" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":$(python scripts/pending_releases.py --json --include "$INCLUDE")}" >> "$GITHUB_OUTPUT"
      - name: Build assets (zips, SBOM, SHA256SUMS, manifest; executes no plugin code)
        run: |
          while read -r slug version; do
            python scripts/build_release_assets.py "$slug" "dist/$slug-$version" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          done < pending.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: |
            dist/
            pending.txt
          if-no-files-found: ignore
  attest:
    name: attest artifacts
    needs: assets
    if: needs.assets.outputs.pending != '0' && vars.PUBLISHING_DISABLED != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write, attestations: write }
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.assets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: art }
      - id: prov
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: art/dist/${{ matrix.slug }}-${{ matrix.version }}/*.zip
      - id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: art/dist/${{ matrix.slug }}-${{ matrix.version }}/*.zip
          sbom-path: art/dist/${{ matrix.slug }}-${{ matrix.version }}/${{ matrix.slug }}-${{ matrix.version }}.sbom.cdx.json
      - name: Verify the attestations (a failure stops the release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify_attestations.sh "art/dist/${{ matrix.slug }}-${{ matrix.version }}" "${{ steps.prov.outputs.bundle-path }}" "${{ steps.sbom.outputs.bundle-path }}"
      - name: Collect bundles
        run: |
          mkdir out
          cp "${{ steps.prov.outputs.bundle-path }}" "out/${{ matrix.slug }}-${{ matrix.version }}.provenance.sigstore.json"
          cp "${{ steps.sbom.outputs.bundle-path }}" "out/${{ matrix.slug }}-${{ matrix.version }}.sbom.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attest-${{ matrix.slug }}-${{ matrix.version }}
          path: out/
  release:
    name: publish release
    needs: [assets, attest]
    if: github.ref == 'refs/heads/main' && github.event.inputs.include == '' && needs.assets.outputs.pending != '0' && vars.PUBLISHING_DISABLED != 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: release-dist, path: art }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: "attest-*", path: att, merge-multiple: true }
      - name: Re-verify attestations, then create tag and release from the artifacts built in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r slug version; do
            d="art/dist/$slug-$version"
            (cd "$d" && sha256sum -c SHA256SUMS)
            scripts/verify_attestations.sh "$d" "att/$slug-$version.provenance.sigstore.json" "att/$slug-$version.sbom.sigstore.json"
            gh release create "$slug-v$version" "$d"/*.zip "$d/SHA256SUMS" "$d/release-manifest.json" "$d/$slug-$version.sbom.cdx.json" \
              "att/$slug-$version.provenance.sigstore.json" "att/$slug-$version.sbom.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$slug $version" --notes-file "$d/RELEASE_NOTES.md"
          done < art/pending.txt
