name: Feature or new plugin request
description: Suggest a rule, option or new plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is painful today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example input and the output you would expect.
    validations: { required: true }
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Plugins are read-only, offline, standard-library Python. Note anything that would need otherwise.
